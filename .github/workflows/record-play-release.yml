name: Record a Play release on GitHub

# Grava a GitHub Release de uma versão que JÁ está no Google Play, sem
# reconstruir e sem reenviar nada.
#
# Existe porque a primeira publicação de um aplicativo não é automatizável ponta
# a ponta: um aplicativo nunca publicado é um *draft app*, a API só aceita
# `status: draft` dele na trilha pública, e quem conclui é uma pessoa no Play
# Console. Quando isso acontece o `publish-play.yml` já terminou, e redisparar
# não serve — ele reconstruiria e reenviaria o mesmo `versionCode`, que a Play
# recusa. Também serve a qualquer versão promovida pelo Console.
#
# Medido em 20/09/2026: a Play disponibiliza o APK universal assim que processa
# o bundle, antes do rollout. O artefato nunca é o que atrasa; o que decide
# quando gravar é a política de só gravar Release do que a loja entrega.
#
# Usa a mesma configuração do `publish-play.yml`: WIF, sem chave guardada.
# O passo nativo de envio/commit identifica o commit do bundle enviado à Play;
# o ref deste disparo não é prova de origem (MAEANDR-29).

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: ID do run de Publish to Google Play que enviou esta versão
        required: true
        type: string
      version_code:
        description: versionCode já publicado no Google Play
        required: true
        type: string

permissions: {}

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  record:
    name: Fetch the Play-signed APK and record the Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Conferir o run e o commit da publicação neste repositório.
      contents: read # Ler referências; somente PLAY_RELEASE_TOKEN grava a Release/tag.
      attestations: read # Verificar/baixar attestations existentes do produtor.
      id-token: write # Token OIDC somente para as credenciais do Google.
    steps:
      - name: Identify the published source commit
        id: publish
        # Todo caminho bem-sucedido do publisher compila e envia o bundle,
        # conferindo seu SHA-256 contra a resposta da Play antes de confirmar.
        # O APK de Actions expira e não existe na primeira publicação em draft;
        # a origem vem do run nativo, não de um artefato temporário nem de main.
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::publish_run_id deve ser o ID numérico do run de publicação."
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID")
          if ! printf '%s' "$run" | jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and
            .head_repository.full_name == $repo and
            (.path | type == "string" and split("@")[0] == ".github/workflows/publish-play.yml") and
            .event == "workflow_dispatch" and
            .status == "completed" and
            (.run_attempt | type == "number" and . >= 1) and
            (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
          ' >/dev/null; then
            echo "::error::O run deve ser uma publicação concluída deste repositório e informar seu commit completo."
            exit 1
          fi
          head_sha=$(printf '%s' "$run" | jq -r '.head_sha')
          # Failed-job reruns can consume the latest attempt without repeating
          # a prior Play commit. Native filter=all preserves that durable proof.
          jobs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID/jobs?filter=all&per_page=100")
          if ! printf '%s' "$jobs" | jq -e --arg sha "$head_sha" --arg run_id "$PUBLISH_RUN_ID" '
            [.[].jobs[] | select(.name == "Build, verify and publish")] |
            length > 0 and
            (length == (unique_by(.id) | length)) and
            all(.[];
              (.id | type == "number" and . > 0 and floor == .) and
              (.run_id | type == "number" and tostring == $run_id) and
              .head_sha == $sha and (.steps | type == "array")
            ) and
            any(.[];
              [.steps[] | select(.name == "Publish and verify artifact identity")] |
              length == 1 and .[0].conclusion == "success"
            )
          ' >/dev/null; then
            echo "::error::Nenhuma tentativa comprovou o passo nativo de envio e commit à Play para este run e commit. Não reenviar nem presumir um commit após falha do passo antigo combinado."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the published source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.publish.outputs.head_sha }}
          persist-credentials: false

      - name: Verify required configuration
        env:
          PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          GCP_QUOTA_PROJECT: ${{ vars.GCP_QUOTA_PROJECT }}
          PLAY_RELEASE_TOKEN: ${{ secrets.PLAY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in PLAY_PACKAGE_NAME WIF_PROVIDER PLAY_SERVICE_ACCOUNT GCP_QUOTA_PROJECT PLAY_RELEASE_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository configuration:$missing."
            exit 1
          fi

      - name: Derive the tag and check it against the sources
        id: version
        # A tag vem do `versionName` do commit do run de publicação.
        # O `versionCode` daquele commit tem de bater com o informado: gravar a
        # Release de uma versão com o nome de outra seria pior que não gravar.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ inputs.version_code }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          PACKAGE: ${{ vars.PLAY_PACKAGE_NAME }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::O checkout não corresponde ao commit do run de publicação."
            exit 1
          fi
          application_id=$(grep -oP 'applicationId = "\K[^"]+' app/build.gradle.kts)
          if [ -z "$application_id" ] || [ "$application_id" != "$PACKAGE" ]; then
            echo "::error::PLAY_PACKAGE_NAME não corresponde ao applicationId do commit publicado."
            exit 1
          fi
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName must be MAJOR.MINOR.PATCH; found '$name'."
            exit 1
          fi
          if [ "$code" != "$VERSION_CODE" ]; then
            echo "::error::O commit publicado está no versionCode $code e foi pedido o $VERSION_CODE. Confira o run informado."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          tag=$(printf 'v%02d.%02d.%02d' "$major" "$minor" "$patch")
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")
          if ! printf '%s' "$refs" | jq -e --arg tag "refs/tags/$tag" \
            'type == "array" and all(.[]; .ref != $tag)' >/dev/null; then
            echo "::error::A tag já existe; não reutilizar nem alterar uma versão gravada."
            exit 1
          fi
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if ! jq -e --arg tag "$tag" 'all(.[][]; .tag_name != $tag)' <<< "$releases" >/dev/null; then
            echo "::error::Uma Release ou rascunho desta tag já existe; não alterar registros anteriores."
            exit 1
          fi
          echo "package=$application_id" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_QUOTA_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Download the Play-signed universal APK
        id: apk
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          QUOTA_PROJECT: ${{ vars.GCP_QUOTA_PROJECT }}
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications

          # Guardar corpo e status: um diagnóstico na saída padrão morre onde a
          # chamada a redireciona, e um HTTP 400 vira "curl: (22)" e nada mais.
          play() {
            local rotulo=$1; shift
            local corpo status
            corpo=$(mktemp)
            status=$(curl -sS -o "$corpo" -w '%{http_code}' "$@") || {
              echo "::error::$rotulo: curl falhou." >&2
              sed 's/^/  /' "$corpo" >&2; rm -f "$corpo"; return 1
            }
            if [ "$status" -ge 400 ]; then
              echo "::error::$rotulo: o Google Play respondeu HTTP $status." >&2
              sed 's/^/  /' "$corpo" >&2; rm -f "$corpo"; return 1
            fi
            cat "$corpo"; rm -f "$corpo"
          }

          auth=(-H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $QUOTA_PROJECT")
          gen="$api/$PACKAGE/generatedApks/$VERSION_CODE"

          listing=$(play "listar os APKs gerados" "${auth[@]}" "$gen")
          universal='[.generatedApks[]? | select(.generatedUniversalApk != null)][0]'
          download_id=$(printf '%s' "$listing" | jq -r "$universal.generatedUniversalApk.downloadId // empty")
          if [ -z "$download_id" ]; then
            echo "::error::O Google Play não tem APK universal para o versionCode $VERSION_CODE."
            exit 1
          fi
          cert=$(printf '%s' "$listing" | jq -r "$universal.certificateSha256Hash // \"unknown\"")

          mkdir -p release
          apk="release/$PACKAGE-$VERSION_NAME.apk"
          play "baixar o APK universal" "${auth[@]}" "$gen/downloads/$download_id:download?alt=media" > "$apk"
          if [ ! -s "$apk" ]; then
            echo "::error::O APK universal do versionCode $VERSION_CODE veio vazio."
            exit 1
          fi
          (cd release && sha256sum "$(basename "$apk")" > SHA256SUMS)

          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "certificate=$cert" >> "$GITHUB_OUTPUT"

      - name: Preserve verified producer provenance when available
        id: provenance
        # Checkout does not change this run's immutable OIDC identity. Never
        # mint a replacement build attestation for a historical producer.
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: |
          set -euo pipefail
          if gh attestation verify "$APK" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-play.yml" \
            --source-digest "$HEAD_SHA"; then
            (cd release && gh attestation download "$(basename "$APK")" --repo "$GITHUB_REPOSITORY")
            bundle="release/sha256:$(sha256sum "$APK" | cut -d' ' -f1).jsonl"
            test -s "$bundle"
            gh attestation verify "$APK" --repo "$GITHUB_REPOSITORY" --bundle "$bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-play.yml" \
              --source-digest "$HEAD_SHA"
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "Producer APK build provenance verified at $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "No verified producer APK build provenance; none was recreated. Published source is independently proven by the native Play commit step, package and version." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create the Release
        # Rascunho primeiro, assets depois, publicar por último: é a ordem que
        # releases imutáveis exigem, porque nada se acrescenta a uma publicada.
        env:
          GH_TOKEN: ${{ secrets.PLAY_RELEASE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ inputs.version_code }}
          CERT: ${{ steps.apk.outputs.certificate }}
          PACKAGE: ${{ steps.version.outputs.package }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          PUBLISH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.publish_run_id }}
          PRODUCER_PROVENANCE: ${{ steps.provenance.outputs.verified }}
        run: |
          set -euo pipefail
          owned_tag=false
          owned_release_id=""
          report_unpublished_attempt() {
            result=$?
            trap - EXIT
            if [ "$result" -eq 0 ] || [ "$owned_tag" != true ]; then return "$result"; fi
            # GitHub has no conditional DELETE that can exclude a concurrent
            # publication or ref update. Preserve state for operator recovery.
            echo "::warning::Preserving this attempt's tag $TAG and draft ${owned_release_id:-not-established}; operator review is required before retry."
            {
              echo "### Release recording failed; native state preserved"
              echo ""
              echo "- source commit: \`$HEAD_SHA\`"
              echo "- created tag: \`$TAG\`"
              echo "- created draft ID: \`${owned_release_id:-not-established}\`"
              echo "- No Release or ref was deleted. Review the native state before recovery; do not re-upload a committed versionCode."
            } >> "$GITHUB_STEP_SUMMARY"
            return "$result"
          }
          trap report_unpublished_attempt EXIT
          {
            cat play/release-notes/pt-BR.txt
            echo ""
            echo "---"
            echo ""
            echo "Binário distribuído pelo Google Play. O APK universal anexado é o que a"
            echo "própria Play gerou e assinou com a chave de assinatura do aplicativo, então"
            echo "instala ao lado de uma instalação da loja e se atualiza com ela."
            echo ""
            echo "- pacote: \`$PACKAGE\`"
            echo "- versionName: \`$VERSION_NAME\` — versionCode: \`$VERSION_CODE\`"
            echo "- certificado de assinatura (SHA-256): \`$CERT\`"
            echo "- commit publicado: \`$HEAD_SHA\`"
            echo "- run de publicação: $PUBLISH_RUN_URL"
            echo ""
            if [ "$PRODUCER_PROVENANCE" = true ]; then
              echo "Attestation do APK pelo workflow produtor verificada no commit publicado."
              echo "Verificar com \`gh attestation verify <apk> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/publish-play.yml --source-digest $HEAD_SHA\`."
            else
              echo "Não foi estabelecida uma attestation do APK pelo produtor. A identidade usa"
              echo "o run, a etapa de commit no Play, applicationId, versão e checksum; este registro"
              echo "não cria nem afirma uma provenance de build do produtor."
            fi
          } > corpo.md

          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG")
          count=$(jq -er --arg ref "refs/tags/$TAG" 'map(select(.ref == $ref)) | length' <<< "$refs")
          if [ "$count" != 0 ]; then
            echo "::error::A tag $TAG apareceu durante o registro; a Release não será criada."
            exit 1
          fi
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if ! jq -e --arg tag "$TAG" 'all(.[][]; .tag_name != $tag)' <<< "$releases" >/dev/null; then
            echo "::error::Uma Release ou rascunho desta tag apareceu; não alterar registros anteriores."
            exit 1
          fi
          # Uma Release em rascunho ainda não materializa uma tag ausente.
          # Criar a referência nativa é atômico: uma tag concorrente faz a API
          # recusar a criação, sem substituir ou mover nenhuma referência.
          created_ref=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$HEAD_SHA")
          owned_tag=true
          if ! jq -e --arg ref "refs/tags/$TAG" --arg sha "$HEAD_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $sha' \
            <<< "$created_ref" >/dev/null; then
            echo "::error::A API não comprovou a nova tag no commit publicado; a Release não será criada."
            exit 1
          fi
          # A resposta nativa identifica o rascunho pertencente a esta tentativa.
          draft=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$TAG" -f "target_commitish=$HEAD_SHA" \
            -F draft=true -f "name=$VERSION_NAME" -F body=@corpo.md)
          owned_release_id=$(jq -er '.id | numbers | select(. > 0)' <<< "$draft")
          if ! jq -e --arg tag "$TAG" '.draft == true and .tag_name == $tag' <<< "$draft" >/dev/null; then
            echo "::error::A API não comprovou o rascunho desta tentativa."
            exit 1
          fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq '.sha')
          if [ "$tag_sha" != "$HEAD_SHA" ]; then
            echo "::error::A tag $TAG não aponta ao commit publicado $HEAD_SHA; o rascunho não será publicado."
            exit 1
          fi
          assets=(release/*.apk release/SHA256SUMS)
          if [ "$PRODUCER_PROVENANCE" = true ]; then assets+=(release/*.jsonl); fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          final_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq '.sha')
          if [ "$final_tag_sha" != "$HEAD_SHA" ]; then
            echo "::error::A tag mudou antes da publicação; preservar a referência alterada."
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          {
            echo "### Release \`$TAG\` gravada"
            echo ""
            echo "- APK universal assinado pela Play, certificado \`$CERT\`"
            echo "- \`SHA256SUMS\`; attestation do produtor verificada: \`$PRODUCER_PROVENANCE\`"
            echo "- commit publicado: \`$HEAD_SHA\` — $PUBLISH_RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
