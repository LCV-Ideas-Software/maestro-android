name: CI

# Compila, analisa e testa o projeto Android em cada pull request e em cada
# push para `main`.
#
# Por que este workflow existe (MAEANDR-14): o `README.md` exige que a
# introducao do scaffold Android traga, na mesma mudanca revisada, validacao do
# Gradle Wrapper, lint, testes, build e analise adequada a Java/Kotlin. O
# projeto Gradle entrou em 17/09/2026 pela MAEANDR-9 e trouxe apenas duas dessas
# pecas -- validacao do wrapper e build --, e ainda assim dentro do
# `publish-play.yml`, que roda por `workflow_dispatch`. Na pratica, nenhum pull
# request deste repositorio era compilado.
#
# O momento importa: isto precisa existir ANTES do primeiro Kotlin, porque o
# primeiro Kotlin e a trava de conteudo aprovado -- a parte que decide se uma
# revisao mexeu so nos blocos que declarou ter mexido, e que nao pode entrar sem
# nada que a compile e a teste automaticamente.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    # Inclui pull requests reapontados e marcados como prontos, para que este
    # check exigido também corra nesses casos.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Check out the repository.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Mesma versão usada pelo `publish-play.yml`. Compilar aqui com um JDK
          # diferente do que publica tornaria este check uma prova sobre outro
          # ambiente que não o de release.
          java-version: "17"

      - name: Validate the Gradle wrapper
        # Recusa um wrapper cujo checksum não corresponda a uma distribuição
        # publicada do Gradle. Já existe no fluxo de publicação; aqui passa a
        # valer para todo pull request, que é onde um wrapper adulterado
        # entraria.
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Lint
        # Executado em passo próprio, e não como parte de `build`, para que a
        # falha diga qual portão reprovou sem exigir leitura do log inteiro.
        run: ./gradlew :app:lintDebug :core:seguranca:lintDebug :core:sessao:lintDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

  instrumented:
    # Os testes do `:core:seguranca` só rodam em aparelho ou emulador: o
    # Android Keystore não existe na JVM. Decisão do operador de 23/09/2026:
    # os casos 2 a 5 da seção 8 da especificação rodam aqui, em toda PR, e
    # este job é verificação obrigatória do ruleset do repositório. O caso 1
    # exige o hardware de StrongBox, que o emulador não tem, e não há aparelho
    # com ele disponível: o teste existe e pula aqui.
    #
    # Os testes do `:core:sessao` rodam no mesmo emulador: o Room precisa do
    # SQLite do Android, e o caso que importa reabre o banco em arquivo depois
    # de descartar cada objeto (especificação, seção 8).
    #
    # Job próprio, com prazo próprio, para que o emulador não entre no prazo
    # do job de build.
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # Check out the repository.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate the Gradle wrapper
        # O mesmo portão do job de build: nenhum `gradlew` roda antes de o
        # wrapper ser conferido contra as distribuições publicadas do Gradle.
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable hardware acceleration for the emulator
        # O passo que o GitHub documenta para usar a aceleração de hardware do
        # emulador Android nos runners Linux (changelog de 02/04/2024,
        # "Hardware accelerated Android virtualization now available").
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        # O emulador é o do Gradle Managed Devices, declarado em
        # `core/seguranca/build.gradle.kts`. A opção de GPU é a que a
        # documentação do Android manda usar no GitHub Actions, que não tem
        # renderização por hardware. `emuladorDaCi=true` faz o teste reprovar,
        # em vez de pular, se o emulador aparecer com trava de tela ou com
        # StrongBox: pular todos os casos passaria sem ter provado nada.
        # `notClass` deixa de fora o caso 1, que exige o hardware de StrongBox:
        # o relatório do Gradle Managed Devices contaria o pulo dele como
        # falha, e o resultado precisa mostrar só o que rodou de fato. Os dois
        # argumentos são inertes para o `:core:sessao`, que não os lê.
        run: >-
          ./gradlew :core:seguranca:api37DebugAndroidTest :core:sessao:api37DebugAndroidTest --no-daemon --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.emuladorDaCi=true
          -Pandroid.testInstrumentationRunnerArguments.notClass=dev.lcv.maestro.seguranca.CofreDeChavesStrongBoxTest

      - name: Require that the instrumented cases ran
        # Autorizado pelo operador em 23/09/2026. Nem o Gradle Managed Devices
        # nem o executor oficial reprovam uma execução em que nenhum teste
        # rodou — medido: um filtro que não casa teste nenhum termina com
        # BUILD SUCCESSFUL e tests="0". Contar não basta: um filtro que
        # deixasse passar um caso só também daria zero falhas. Este passo lê
        # o XML oficial do resultado e exige que ele traga exatamente os
        # métodos `@Test` das fontes instrumentadas — menos a classe do caso
        # 1, que fica de fora de propósito —, cada um sem falha, erro ou pulo.
        # Um módulo por vez, cada um contra o seu próprio XML.
        run: |
          python3 - <<'EOF'
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          modulos = (
              ("core/seguranca", {"CofreDeChavesStrongBoxTest"}),
              ("core/sessao", set()),
          )
          reprovado = False
          for modulo, fora in modulos:
              fontes = pathlib.Path(modulo, "src/androidTest/kotlin")
              esperados = {
                  (arquivo.stem, nome)
                  for arquivo in fontes.rglob("*.kt")
                  if arquivo.stem not in fora
                  for nome in re.findall(r"@Test\s+fun\s+(\w+)", arquivo.read_text(encoding="utf-8"))
              }
              raiz = ET.parse(
                  f"{modulo}/build/outputs/androidTest-results/managedDevice/debug/api37/TEST-api37.xml"
              ).getroot()
              rodados = {}
              for caso in raiz.iter("testcase"):
                  chave = (caso.get("classname").rsplit(".", 1)[-1], caso.get("name"))
                  rodados[chave] = [filho.tag for filho in caso]
              print(f"{modulo}: expected {len(esperados)}, ran {len(rodados)}")
              faltando = sorted(esperados - rodados.keys())
              sobrando = sorted(rodados.keys() - esperados)
              ruins = sorted(chave for chave, tags in rodados.items() if tags)
              for rotulo, lista in (("missing", faltando), ("unexpected", sobrando), ("not passing", ruins)):
                  for chave in lista:
                      print(f"{modulo} {rotulo}: {chave[0]}.{chave[1]}")
              if not esperados or faltando or sobrando or ruins:
                  reprovado = True
          if reprovado:
              sys.exit("the instrumented results do not show every expected case run and passing")
          EOF

      - name: Keep the instrumented test results
        # O Gradle não imprime no log quantos testes rodaram nem quais pularam.
        # O resultado fica como artefato, para que se possa conferir que os
        # casos rodaram de fato no emulador, e não apenas que o job passou.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-results
          path: |
            core/seguranca/build/outputs/androidTest-results/
            core/sessao/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: error
