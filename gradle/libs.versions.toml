# Catálogo de versões (mecanismo oficial do Gradle). O Dependabot lê este
# arquivo e mantém cada entrada atualizada pelo ecossistema `gradle` já
# declarado em `.github/dependabot.yml`.
#
# O catálogo nasce com o mínimo que a entrega do `:core:protocolo` usa. As
# bibliotecas de rede, persistência e interface entram nas entregas que
# precisarem delas — declarar hoje o que só será usado em `:core:provedores`
# criaria inventário de terceiros para dependência que ninguém compila.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
junit = "6.1.3"
jackson = "2.22.3"
commonmark = "0.30.0"
okhttp = "5.5.0"
crawler-commons = "1.6"
slf4j = "2.0.19"
coroutines = "1.11.0"
datastore = "1.2.1"
room = "2.8.5"
work = "2.12.0"
ksp = "2.3.12"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-espresso = "3.7.0"
compose-bom = "2026.09.00"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.2.0"
kotlinx-serialization = "1.11.0"

[libraries]
# Leitura do `maestro_revision_report`. O relatório é JSON por contrato
# (`editorial_prompts.rs:487`, "JSON-like audit data"), e relatório truncado já
# é violação declarada (`:503`). A trava usa
# `StreamReadFeature.STRICT_DUPLICATE_DETECTION`, que a FasterXML documenta como
# desligada por padrão e que lança `JsonParseException` em campo duplicado —
# é o que fecha, sem lógica própria, a ambiguidade de dois `protocol_basis` ou
# dois `change_type` na mesma entrada.
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# O HTML cru do texto final, que é Markdown, reconhecido pela seção 6.6 da
# especificação CommonMark na auditoria de citações do `:core:protocolo`. A
# commonmark-java é a implementação Java da especificação, com a posição de
# origem de cada nó; o reconhecimento escrito à mão levou seis rodadas de
# revisão (decisão do operador de 24/09/2026).
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
# A extensão oficial de tabelas GFM da commonmark-java: a tela de licenças do
# `:app` lê o `THIRDPARTY.md`, que é Markdown com tabelas, pela implementação de
# referência, e não por um leitor escrito à mão.
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
# Transporte dos seis provedores em `:core:provedores` (especificação, seção
# 5.3). Só o OkHttp, sem Retrofit: cada provedor é um POST num endpoint só, com
# corpo JSON montado pelo Jackson, e o Retrofit só embrulharia o mesmo OkHttp
# (decisão do operador de 23/09/2026). `okhttp-coroutines` é o módulo oficial
# do OkHttp que liga o cancelamento da corrotina ao da chamada.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-coroutines = { module = "com.squareup.okhttp3:okhttp-coroutines", version.ref = "okhttp" }
# A rede da auditoria de links (especificação, seções 2.2 e 5.4; decisões do
# operador de 25/09/2026). `okhttp-dnsoverhttps` é o módulo oficial do OkHttp
# de DNS sobre HTTPS: toda resolução de nome da auditoria vai ao Google
# (`dns.google`), e cada endereço resolvido passa pelo filtro da `RedePublica`.
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
# `robots.txt` pela RFC 9309: o parser de referência em Java, no lugar de um
# parser de especificação escrito à mão.
crawler-commons = { module = "com.github.crawler-commons:crawler-commons", version.ref = "crawler-commons" }
# O crawler-commons registra logs pelo SLF4J; sem um provedor, o SLF4J avisa
# no stderr e não registra nada. O `slf4j-nop` oficial silencia o aviso.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Onde o `:core:seguranca` guarda o cifrado de cada chave de API (especificação,
# seção 6.1): DataStore comum do aplicativo. O cifrado não serve sem a chave do
# Keystore, que não sai do aparelho.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# O estado da sessão no `:core:sessao` (especificação, seção 4.2): Room no lugar
# do D1 — sessão, artefatos, configurações, registros de links, evidências e
# anexos. `room-runtime` já contém o que era `room-ktx` (desde a 2.7.0); o
# `room-compiler` roda no KSP; `room-testing` só em teste instrumentado.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# A orquestração no aparelho (especificação, seção 4.1): `CoroutineWorker` com
# `setForeground()` do tipo `dataSync`. `work-runtime` já contém o que era
# `work-runtime-ktx` (desde a 2.9.0) e expõe `getStopReason()`, que a seção
# 4.1 exige. `work-testing` só em teste instrumentado.
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
# A interface do `:app` (quarta entrega, especificação, seção 2.3): Jetpack
# Compose com Material 3, pelo BOM oficial, que fixa a versão de cada artefato
# do Compose; `activity-compose` liga a Activity ao Compose e traz o registro
# de resultados (permissão de notificações, seletor de documentos); os
# artefatos do Lifecycle dão o `ViewModel`, a coleta de `Flow` presa ao ciclo de
# vida e o `ProcessLifecycleOwner`, que dispara a reconciliação na abertura do
# aplicativo (seção 4.3). Versões conferidas no repositório Maven do Google em
# 28/09/2026.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
# A navegação entre as telas é a Navigation 3: o plano do `:app` (ponto C1,
# aprovado na revisão cruzada de 28/09/2026) a manda usar se houver versão 1.x
# estável na página oficial de lançamentos no dia, e havia — 1.2.0, de
# 23/09/2026 (https://developer.android.com/jetpack/androidx/releases/navigation3).
# A pilha de volta é uma lista de chaves do próprio aplicativo;
# `lifecycle-viewmodel-navigation3` dá a cada tela da pilha o seu `ViewModel`,
# descartado quando ela sai da pilha.
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
# `rememberNavBackStack` guarda as chaves da pilha pelo kotlinx.serialization
# (cada chave é `@Serializable`); declarado na versão estável corrente, e não
# na que a Navigation 3 traz de carona.
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
# Só em teste instrumentado: o Keystore só existe em aparelho ou emulador.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
# Só em teste: servidor HTTP falso, para nenhum teste falar com provedor real.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
# Só em teste: certificados de mentira, para o servidor falso falar HTTPS.
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Processador de anotações do Room (KSP2, o recomendado pelo Room para o
# Kotlin 2.x) e o plugin oficial do Room, que exporta o esquema para `schemas/`.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
# O compilador do Compose, que desde o Kotlin 2.0 é plugin do próprio Kotlin.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# O plugin oficial do kotlinx.serialization, também do próprio Kotlin: gera o
# serializador das chaves da navegação.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
