<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Página de preparação do Maestro Android, da LCV Ideas &amp; Software."
    />
    <link rel="canonical" href="https://maestro-android.lcv.dev/" />
    <title>Maestro Android — LCV Ideas &amp; Software</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        background: #0b1020;
        color: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top, #293b70, #0b1020 58%);
      }
      main {
        width: min(46rem, 100%);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #536aa4;
        border-radius: 1.5rem;
        background: rgb(14 24 50 / 92%);
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%);
      }
      p { color: #d5def4; }
      .eyebrow {
        color: #a5b4fc;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      h1 {
        margin: .25rem 0 1rem;
        font-size: clamp(2.3rem, 9vw, 4.5rem);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">LCV Ideas &amp; Software</p>
      <h1>Maestro Android</h1>
      <p>
        O aplicativo ainda está em preparação. Esta página publica apenas a
        superfície institucional mínima e não coleta dados nem carrega
        rastreadores.
      </p>
    </main>
  </body>
</html>
